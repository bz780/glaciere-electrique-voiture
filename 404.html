<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>404 : page introuvable</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#152233;background:#f7fafc;display:flex;align-items:center;justify-content:center;line-height:1.5;padding:24px}
.box{max-width:520px;text-align:center;background:#fff;border-radius:14px;padding:48px 32px;box-shadow:0 4px 32px rgba(15,40,70,.08);border:1px solid #e2e8ef}
.code{font-size:clamp(64px,12vw,96px);font-weight:800;line-height:1;color:#152233;letter-spacing:-.02em;margin-bottom:16px}
h1{font-size:clamp(20px,3vw,28px);font-weight:700;margin-bottom:14px;color:#152233}
p{color:#3b4a5a;margin-bottom:28px;font-size:.96rem}
.btn{display:inline-block;background:#1670b3;color:#fff;text-decoration:none;padding:13px 28px;border-radius:8px;font-weight:600;transition:transform .12s,background .15s}
.btn:hover{background:#0f4d80;transform:translateY(-1px)}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>L'adresse demandee est introuvable. Elle a peut-etre ete deplacee, supprimee, ou le lien comporte une faute de frappe.</p>
  <a href="/" class="btn">Retour a l'accueil</a>
</main>
</body>
</html>
